# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (browsers, VMs) go alongside.
name: flake
on:
  # A PR retargeted onto another branch runs from flake-retarget.yml.
  pull_request:
  # PRs land through conaryd's merge train, which pushes each candidate it
  # would land (main with the PRs in it on top) to a conary/train/ branch: the
  # gate runs there and attests the tree that lands.
  push:
    branches: [main, "conary/train/**"]
jobs:
  check:
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@5fe4bb5868149b51bdb3cf2a555eb297ab41951a # main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
